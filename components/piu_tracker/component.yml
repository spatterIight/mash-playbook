---

activation_prefix: piu_tracker_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ piu_tracker_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ piu_tracker_restart_necessary | bool }}"
        groups: [mash, piu-tracker]
        when: "{{ piu_tracker_enabled }}"
